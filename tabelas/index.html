<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>

    <table>
        <caption>Lista de Compras de Hardware</caption>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>SSD 1TB</td>
                <td>2</td>
                <td>R$ 400,00</td>
            </tr>
            <tr>
                <td>Memória RAM 16GB</td>
                <td>1</td>
                <td>R$ 350,00</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Total</td>
                <td>3</td>
                <td>R$ 750,00</td>
            </tr>
            <tr>
                <td colspan="3">Informações de contato</td>
            </tr>
        </tfoot>
    </table>
    
</body>
</html>
