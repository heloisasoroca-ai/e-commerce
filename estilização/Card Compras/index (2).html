<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Card de Produto</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <article class="product-card">
      <div class="card-image-container">
        <span class="badge-discount">-20% OFF</span>
        <img
          src="tenis.jpg"
          alt="Tênis Nike Air Max Red"
          class="product-image"
        />
      </div>
      <div class="card-content">
        <span class="category">Calçados Esportivos</span>
        <h3 class="title">Nike Air Max Red Run</h3>
        <p class="description">
          Máximo conforto e tecnologia de absorção de impacto para alta perfo
        </p>
        <div class="price-box">
          <span class="old-price">R$ 499,90</span>
          <span class="current-price">R$ 399,90</span>
        </div>
        <button class="btn-buy">Comprar Agora</button>
      </div>
    </article>
  </body>
</html>
<style>
    *, *::before, *::after {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: 'Inter', system-ui, sans-serif;
background-color: #f1f5f9;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}
/* Card Principal */
.product-card {
width: 100%;
max-width: 320px;
background-color: #ffffff;
border-radius: 16px;
overflow: hidden;
box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.product-card:hover {
transform: translateY(-8px);
box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.15);
}
/* Imagem & Badge Flutuante */
.card-image-container {
position: relative;
height: 200px;
background-color: #f8fafc;
overflow: hidden;
}
.product-image {
width: 100%;

height: 100%;
object-fit: cover;
transition: transform 0.4s ease;
}
.product-card:hover .product-image {
transform: scale(1.08); /* Zoom sutil na foto */
}
.badge-discount {
position: absolute;
top: 12px;
left: 12px;
background-color: #ef4444;
color: #ffffff;
font-size: 11px;
font-weight: bold;
padding: 4px 10px;
border-radius: 20px;
z-index: 2;
}
/* Conteúdo & Tipografia */
.card-content {
padding: 20px;
}
.category {
font-size: 11px;
text-transform: uppercase;
letter-spacing: 0.05em;
color: #64748b;
font-weight: bold;
}
.title {
font-size: 18px;
color: #0f172a;
margin: 6px 0;
}
.description {
font-size: 13px;

color: #64748b;
line-height: 1.4;
margin-bottom: 16px;
}
/* Preço e Botão */
.price-box {
display: flex;
align-items: baseline;
gap: 10px;
margin-bottom: 16px;
}
.old-price {
font-size: 13px;
color: #94a3b8;
text-decoration: line-through;
}
.current-price {
font-size: 22px;
font-weight: 800;
color: #ef4444;
}
.btn-buy {
width: 100%;
padding: 12px;
background-color: #ef4444;
color: #ffffff;
border: none;
border-radius: 8px;
font-weight: bold;
font-size: 15px;
cursor: pointer;
transition: background-color 0.2s ease;
}
.btn-buy:hover {
background-color: #dc2626;
}
</style>
