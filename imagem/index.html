<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <img
      src="aparecida10.webp"
      alt="Imagem de Nossa Senhora Aparecida."
      width="800"
      height="500"
    />
    <picture>
      <source
        src="retrato-de-voluntarios-que-organizaram-doacoes-para-instituicoes-de-caridade_23-2149230571 (1).avif"
        type="imagem/avif"
      />
      <source srcset="aparecida10.webp" type="imagem/webp" />
      <img
        src="images (1).jpg"
        alt="Imagem de uma borboleta pousada em uma flor."
        width="300"
      />
    </picture>

    <div class="box-fixo">
      <img src="cherry.webp" alt="cerejeira" class="img-cover" />
      </div>

      <img src="cherry.webp" alt="cerejeira" class="img-container" />
    </div>

      <img src="cherry.webp" alt="cerejeira" class="img-fill" />
    </div>

      <img src="cherry.webp" alt="cerejeira" class="img-avatar" />

      <img src="cherry.webp" alt="cerejeira" class="img-card-estilizado" />

      <img src="cherry.webp" alt="cerejeira" class="img-aspecto" />

      <img src="cherry.webp" alt="cerejeira" class="img-grayscale" />

      <img src="cherry.webp" alt="cerejeira" class="img-sepia" />

      <img src="cherry.webp" alt="cerejeira" class="img-blur" />

    <div class="wrapper-zoom">
      <img src="images (1).jpg" alt="Borboleta" class="img-zoom" />
    </div>

     <img src="images (1).jpg" alt="Borboleta" class="img-rotacao" />

    <div class="card-composto">
      <img
        src="imagem(3).jpg"
        alt="foto de uma ara vermelha"
        class="img-composta"
      />
      <div class="card-overlay">
        <h3>Tênis Nike Air Max</h3>
        <p>R$ 399,90< - Edição Limitada/p></p>
      </div>
    </div>

    <div class="carrosel-snap">
      <div class="item-snap">
        <img src="images (4).jpg" alt="Tênis Vista 1" />
        <span class="legenda">Visão Lateral</span>
      </div>

      <div class="item-snap">
        <img src="images (5).jpg" alt="Tênis Vista 2" />
        <span class="legenda">Detalhe da Loja</span>
      </div>

      <div class="item-span">
        <img src="images (6).jpg" alt="Tênis Vista 3" />
        <span class="legenda">Edição Especial</span>
      </div>
    </div>
  </body>
</html>
