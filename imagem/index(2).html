<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine do Produto - Imagem de Referência</title>
    <link rel="stylesheet" href="style(2).css">
</head>
<body>
<main class="conatiner">
    <h1>Galeria Comparativa do Produto</h1>

    <div class="grid-vitrine">

        <article class="card">
            <div class="card-media">
                <img src="images (9).jpg" alt="Tênis Normal" class="modo-cover">
            </div>
            <h4>Estilo Padrão (Cover)</h4>
        </article>

        <article class="card">
            <div class="card-media wrapper-zoom">
                <img src="images (8).jpg" alt="Tênis Zoom" class="modo-container">
            </div>
            <h4>Hover Zoom (+15%)</h4>
        </article>

        <article class="card">
            <div class="card-media wrapper-zoom">
                <img src="images (8).jpg" alt="Tênis Zoom" class="avatar-circular">
            </div>
            <p>Avatar Circular</p>
        </article>

        <article class="card">
            <div class="card-media">
                <img src="images (7).jpg" alt="Tênis Grayscale" class="filtro-sepia">
            </div>
            <h4>Filtro Preto & Branco</h4>
        </article>

    </div>
</main>
    
</body>
</html>
